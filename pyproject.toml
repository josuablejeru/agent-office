[project]
name = "agent-office"
version = "0.1.0"
description = "Local-first agents, each with its own persistent QEMU VM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "websockets>=17,<18",
    "anthropic[vertex]>=1.11.0",
]

[dependency-groups]
app = [
    "pywebview>=6.2.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
# ASYNC109: a `timeout` argument is the natural API for guest and subprocess calls here.
# ASYNC240: checking or removing a small local file does not hold the loop up noticeably.
ignore = ["E501", "B008", "ASYNC109", "ASYNC240"]
